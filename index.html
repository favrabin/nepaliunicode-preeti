<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicode to Preeti Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔄 Unicode to Preeti Converter</h1>
    <p class="subtitle">Powerful & Accurate Nepali Unicode ↔ Preeti Tool</p>

    <div class="converter">
      <div class="box">
        <h3>Unicode (Modern)</h3>
        <textarea id="unicode" placeholder="यहाँ Unicode नेपाली टाइप गर्नुहोस्..."></textarea>
      </div>
      <div class="box">
        <h3>Preeti Font</h3>
        <textarea id="preeti" placeholder="Preeti Output यहाँ आउँछ..."></textarea>
      </div>
    </div>

    <div class="buttons">
      <button id="convertBtn" class="btn primary">Unicode → Preeti</button>
      <button id="clearBtn" class="btn secondary">Clear All</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
